<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Ruturaj Pangavhane, AI Engineer">
<title>Ruturaj Pangavhane, AI Engineer</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F2438"/><stop offset="1" stop-color="#183B57"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F0C35A"/><stop offset="1" stop-color="#9CC5A1"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F0C35A" stop-opacity="0.22"/><stop offset="1" stop-color="#F0C35A" stop-opacity="0"/></radialGradient>
<clipPath id="wipe"><rect class="wr" x="0" y="0" width="760" height="320"/></clipPath>
</defs>
<style>
text{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
.row{stroke:#2A5273;stroke-width:2;stroke-linecap:round}
.flow{stroke:#F0C35A;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 34;animation:flow 1.6s linear infinite}
.f2{animation-duration:2.1s}.f3{animation-duration:1.8s;animation-delay:-.6s}.f4{animation-duration:2.4s;animation-delay:-1s}
@keyframes flow{to{stroke-dashoffset:-40}}
.edge{stroke:#9CC5A1;stroke-opacity:.18;stroke-width:1}
.n{fill:#183B57;stroke:#9CC5A1;stroke-width:1.5;animation:light 5s ease-in-out infinite}
.l0{animation-delay:0s}.l1{animation-delay:.5s}.l2{animation-delay:1s}.l3{animation-delay:1.5s}
@keyframes light{0%,8%{fill:#183B57;stroke:#9CC5A1}22%,55%{fill:#F0C35A;stroke:#F0C35A}75%,100%{fill:#183B57;stroke:#9CC5A1}}
.wr{animation:wipe 1.4s cubic-bezier(.2,.7,.2,1) .2s both}
@keyframes wipe{from{width:0}to{width:760px}}
.tag{font-size:25px;fill:#9CC5A1;opacity:0;animation:tag 9s ease-in-out infinite}
.t0{animation-delay:1.8s}.t1{animation-delay:4.8s}.t2{animation-delay:7.8s}
@keyframes tag{0%{opacity:0}6%,30%{opacity:1}36%,100%{opacity:0}}
.cursor{fill:#F0C35A}
</style>
